name: Release

# 打 tag（v*）时构建并发布 Windows 安装包（.exe）到 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布 exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 让产物版本号与 tag 一致（如 v1.2.3 -> 1.2.3），否则文件名始终是 package.json 里的版本
      - name: 设置版本号
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          npm pkg set version=$ver

      - name: 构建前端
        run: npm run build

      # 打包 NSIS 安装程序 + 免安装版（win-unpacked）。
      # signAndEditExecutable=true 让 rcedit 在 CI 上正常嵌入图标与版本信息
      # （本机因安全软件问题在 package.json 里关闭了它）；CSC_IDENTITY_AUTO_DISCOVERY=false 跳过代码签名。
      - name: 打包 exe
        run: npx electron-builder --win --config.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # 免安装绿色版单独打一个 zip，方便不使用安装程序的用户直接解压运行
      - name: 压缩免安装版
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path "release_app/win-unpacked/*" -DestinationPath "release_app/MarkdownEditor-portable-$ver.zip" -Force

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_app/*.exe
            release_app/*.zip
          generate_release_notes: true
